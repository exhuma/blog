{% extends "base.html" %}
{% block title %}Tags - {{ SITENAME }}{% endblock %}
{% block content %}
<h1 class="page-title">Tags</h1>
<ul class="tag-list">
  {% for tag, articles in tags|sort(attribute="0") %}
  <li><a class="ma-tag" href="{{ SITEURL }}/{{ tag.url }}">{{ tag }} &middot; {{ articles|count }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
