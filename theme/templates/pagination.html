{% if articles_paginator and articles_paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if articles_page.has_previous() %}
  <a href="{{ SITEURL }}/{{ articles_previous_page.url }}" rel="prev">&larr; Newer</a>
  {% else %}
  <span></span>
  {% endif %}
  <span class="muted">{{ articles_page.number }} / {{ articles_paginator.num_pages }}</span>
  {% if articles_page.has_next() %}
  <a href="{{ SITEURL }}/{{ articles_next_page.url }}" rel="next">Older &rarr;</a>
  {% else %}
  <span></span>
  {% endif %}
</nav>
{% endif %}
