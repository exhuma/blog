{% extends "base.html" %}
{% block title %}Categories - {{ SITENAME }}{% endblock %}
{% block content %}
<h1 class="page-title">Categories</h1>
<ul class="index-list">
  {% for category, articles in categories %}
  <li>
    <span class="count">{{ articles|count }} posts</span>
    <a href="{{ SITEURL }}/{{ category.url }}">{{ category }}</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
