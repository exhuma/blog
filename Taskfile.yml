# https://taskfile.dev
version: '3'

vars:
  OUTPUT_DIR: output
  CONTENT_DIR: content
  DEV_CONF: pelicanconf.py
  PROD_CONF: publishconf.py
  PORT: '8000'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ── Environment ────────────────────────────────────────────────────────────

  install:
    desc: Set up virtual environment and install dependencies
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install --upgrade pip
      - .venv/bin/pip install -r requirements.txt
    sources:
      - requirements.txt
    generates:
      - .venv/bin/pelican

  # ── Building ────────────────────────────────────────────────────────────────

  build:
    desc: Build the site using the development config
    deps: [install]
    cmds:
      - .venv/bin/pelican {{.CONTENT_DIR}} -o {{.OUTPUT_DIR}} -s {{.DEV_CONF}}

  build:prod:
    desc: Build the site using the production config (SITEURL, feeds, etc.)
    deps: [install]
    cmds:
      - .venv/bin/pelican {{.CONTENT_DIR}} -o {{.OUTPUT_DIR}} -s {{.PROD_CONF}}

  rebuild:
    desc: Clean then build from scratch (dev config)
    cmds:
      - task: clean
      - task: build

  # ── Shelf (old slides, served under /shelf) ────────────────────────────────

  shelf:pack:
    desc: Pack the local shelf/ folder into shelf.tar.gz for the GitHub release
    cmds:
      # The excluded archives are exact copies of the unpacked deck folders.
      - >-
        python3 tools/pack_shelf.py shelf {{.SHELF_TARBALL}}
        --exclude python-advanced-2018/python-advanced-2018.tar.gz
        --exclude python-advanced-2019/python-advanced-2019.tar.gz
        --exclude python-advanced-2023/python-advanced-2023.tar.gz
        --exclude python-basic-2019/python-basic-2019.tar.gz
        --exclude python-basic-2020/python-basic-2020.tar.gz
        --exclude python-basic-2022/python-basic-2022.tar.gz
        --exclude python-basic-2023/python-basic-2023.tar.gz
        --exclude git-2018/git-2018.tar.gz
        --exclude git-2022/git-2022.zip
        --exclude http-talk-2020/http-talk-2020.tar.gz
    vars:
      SHELF_TARBALL: '{{.SHELF_TARBALL | default "shelf.tar.gz"}}'

  # ── Cleaning ────────────────────────────────────────────────────────────────

  clean:
    desc: Remove generated output directory
    cmds:
      - rm -rf {{.OUTPUT_DIR}}

  # ── Local development ───────────────────────────────────────────────────────

  serve:
    desc: Build and serve the site locally on http://localhost:{{.PORT}}
    deps: [build]
    cmds:
      - python3 -m http.server {{.PORT}} --directory {{.OUTPUT_DIR}}

  watch:
    desc: Watch for content changes and rebuild automatically (no server)
    deps: [install]
    cmds:
      - .venv/bin/pelican --autoreload {{.CONTENT_DIR}} -o {{.OUTPUT_DIR}} -s {{.DEV_CONF}}

  dev:
    desc: Watch + serve simultaneously (equivalent to the old develop_server.sh)
    deps: [install]
    cmds:
      # Pelican 4.5+ supports --autoreload --listen for a combined dev server.
      # If using an older Pelican, upgrade requirements.txt first.
      - .venv/bin/pelican --autoreload --listen --port {{.PORT}} {{.CONTENT_DIR}} -o {{.OUTPUT_DIR}} -s {{.DEV_CONF}}
